<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Ready Hub</title>
<style>
body{--bg:#f3f4f6;--card:#fff;--cardbg:#fff;--text:#111827;--muted:#6b7280;--line:#d1d5db;--accent:#4f46e5;--bt:#fff;--side:#1f2937;--st:#fff;margin:0;font-family:Arial,sans-serif;display:flex;height:100vh}
body.dark{--bg:#0a0e0c;--card:#141b17;--cardbg:linear-gradient(135deg,#1f3329,#111714);--text:#f3f4f6;--muted:#9ca3af;--line:#27322c;--accent:#1ba94c;--side:#070a08;--st:#e5e7eb}
#sidebar{width:250px;background:var(--side);color:var(--st);padding:16px;box-sizing:border-box;display:flex;flex-direction:column;position:relative}
#sidebar h2{margin:0 0 12px}
#newBtn{padding:10px;border:1px solid #4b5563;border-radius:8px;background:none;color:var(--st);cursor:pointer;text-align:left}
.nh{margin:20px 0 6px;font-size:13px;opacity:.7}
#history{flex:1;overflow:auto}
.hi{display:flex;align-items:center;padding:5px 4px 5px 10px;border-radius:6px;font-size:14px}
.hi:hover,#newBtn:hover{background:rgba(255,255,255,.1)}
.ht{flex:1;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{background:none;border:none;color:var(--st);font-size:20px;cursor:pointer;padding:0 8px}
#hmenu{display:none;position:fixed;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px;z-index:20}
#hmenu button,.mi{display:block;width:100%;padding:8px 12px;border:none;background:none;color:var(--text);cursor:pointer;text-align:left;font-size:14px;border-radius:6px}
#hmenu button{color:#ef4444}
#hmenu button:hover,.mi:hover{background:rgba(128,128,128,.2)}
#gear{width:44px;height:44px;border-radius:50%;border:none;background:#4b5563;color:#fff;font-size:22px;cursor:pointer;margin-top:10px;align-self:flex-start}
#settings{display:none;position:absolute;left:12px;bottom:64px;width:210px;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:6px;z-index:5}
#apRow{display:none;padding:4px 12px 8px}
#main{flex:1;padding:14px 26px 30px;background:var(--bg);color:var(--text);overflow:auto}
#topbar{display:flex;align-items:center;gap:6px;margin-bottom:14px;border-bottom:1px solid var(--line);padding-bottom:8px;flex-wrap:wrap}
.sp{flex:1}
.tab{background:none;border:none;color:var(--muted);font-size:15px;padding:8px 10px;cursor:pointer;border-bottom:3px solid transparent}
.tab.on{color:var(--text);border-bottom-color:var(--accent);font-weight:bold}
#loginBtn{padding:8px 16px;border-radius:8px;border:none;background:var(--accent);color:var(--bt);cursor:pointer}
#avatar{display:none;align-items:center;gap:8px;cursor:pointer}
#avatar .c{width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--bt);display:flex;align-items:center;justify-content:center;font-weight:bold}
.view{display:none}.view.on{display:block}
select,input{padding:7px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--text)}
.filters{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.chip{padding:6px 12px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;font-size:13px;display:inline-block;margin:3px 3px 3px 0;text-decoration:none}
.chip.active{background:var(--accent);color:var(--bt);border-color:var(--accent)}
.boxes{display:flex;gap:14px}
.card{flex:1;background:var(--cardbg);border:1px solid var(--line);border-radius:12px;padding:12px}
.ch{display:flex;justify-content:space-between;margin-bottom:8px}
.muted{color:var(--muted);font-size:12px}
textarea{width:100%;box-sizing:border-box;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-family:inherit}
.card textarea{height:140px}
.code{height:140px;font-family:Consolas,monospace}
button.go{margin-top:12px;padding:11px 22px;border:none;border-radius:8px;background:var(--accent);color:var(--bt);font-size:15px;cursor:pointer}
.step{background:var(--card);border-left:5px solid var(--accent);padding:10px 14px;margin:10px 0;border-radius:6px}
.step label{display:block;margin:4px 0}
.tip{border-left-color:#f59e0b}
.bar{background:var(--line);border-radius:10px;height:20px;overflow:hidden;margin:8px 0}
.fill{background:var(--accent);height:100%}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-width:500px}
.head{font-weight:bold;text-align:center;font-size:12px;color:var(--muted)}
.cell{border-radius:6px;padding:6px 2px;text-align:center;font-size:12px;color:#fff}
.cell.today{outline:3px solid #f59e0b}
.lg span{display:inline-block;color:#fff;padding:3px 10px;border-radius:12px;margin:4px 6px 4px 0;font-size:13px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:12px}
.dcard{background:var(--cardbg);border:1px solid var(--line);border-radius:14px;padding:20px;cursor:pointer;min-height:90px}
.dcard:hover{border-color:var(--accent)}
.dcard b{font-size:18px;display:block;margin-bottom:6px}
.clock{font-weight:bold;color:#f59e0b;margin:8px 0}
pre{background:var(--bg);border:1px solid var(--line);padding:10px;border-radius:8px;overflow:auto}
details{background:var(--bg);border-left:5px solid var(--accent);border-radius:6px;margin:8px 0;padding:8px 12px}
summary{cursor:pointer;font-weight:bold}
details p{margin:8px 0}
#ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);align-items:center;justify-content:center;z-index:30}
#mbox{width:380px;max-width:92%;max-height:82vh;overflow:auto;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:22px}
#mbox h2{margin:0 0 10px}
#mbox input{width:100%;padding:9px;margin-bottom:10px;box-sizing:border-box}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;gap:10px}
.mb{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.err{color:#f87171}.ok{color:#22c55e}
#sw{position:relative}
#qres{display:none;position:absolute;right:0;top:36px;width:290px;max-height:260px;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:10px;z-index:15}
#qres div{padding:9px 12px;cursor:pointer}
#qres div:hover{background:rgba(128,128,128,.2)}
</style>
</head>
<body>

<div id="sidebar">
  <h2>Job Ready Hub</h2>
  <button id="newBtn">+ New analysis</button>
  <div class="nh">History</div>
  <div id="history"></div>
  <div id="settings">
    <button class="mi" data-a="profile">Profile</button>
    <button class="mi" data-a="appear">Appearance</button>
    <div id="apRow"><button class="chip" id="lightBtn">Light</button><button class="chip" id="darkBtn">Dark</button></div>
    <button class="mi" data-a="board">Leaderboard</button>
    <button class="mi" data-a="tt">Study Timetable</button>
    <button class="mi" data-a="marks">Bookmarks</button>
    <button class="mi" data-a="subs">Submissions</button>
    <button class="mi" data-a="logout">Logout</button>
  </div>
  <button id="gear" title="Settings">&#9881;</button>
</div>
<div id="hmenu"><button id="delBtn">Delete</button></div>

<div id="main">
  <div id="topbar">
    <button class="tab on" data-v="dash">Dashboard</button>
    <button class="tab" data-v="match">Job Match</button>
    <button class="tab" data-v="practice">Problems</button>
    <select id="fieldSel" title="Your field"></select>
    <div id="sw"><input id="q" placeholder="Search..." style="width:170px"><div id="qres"></div></div>
    <div class="sp"></div>
    <button id="loginBtn">Login</button>
    <div id="avatar"><span class="c" id="avL"></span><span id="avN"></span></div>
  </div>

  <div class="view on" id="v_dash"></div>

  <div class="view" id="v_match">
    <div class="filters">
      <label>Job type <select id="jobType"><option value="internship">Internship</option><option value="fulltime">Full-time</option><option value="parttime">Part-time</option><option value="remote">Remote</option></select></label>
      <label>Experience <select id="exp"><option value="fresher">Fresher</option><option value="junior">1-3 years</option><option value="mid">3-5 years</option></select></label>
      <label>Study time <select id="hoursSel"><option value="1">1 hour</option><option value="2" selected>2 hours</option><option value="custom">Custom</option></select></label>
      <input id="customHours" type="number" min="0.5" max="12" step="0.5" placeholder="hours per day" style="display:none;width:120px">
    </div>
    <div class="boxes">
      <div class="card">
        <div class="ch"><b>1. Your resume</b><span class="muted" id="rc">0 words</span></div>
        <textarea id="resume" placeholder="Paste your resume, or upload a .txt file..."></textarea>
        <div><label class="chip">Upload .txt<input type="file" id="rfile" accept=".txt" hidden></label><button class="chip" id="rsample">Use sample</button><button class="chip" id="rclear">Clear</button></div>
      </div>
      <div class="card">
        <div class="ch"><b>2. Job description</b><span class="muted" id="jc">0 words</span></div>
        <textarea id="job" placeholder="Paste the job description, or pick a sample role..."></textarea>
        <div><label class="chip">Upload .txt<input type="file" id="jfile" accept=".txt" hidden></label><select id="roleSel"></select><button class="chip" id="jclear">Clear</button></div>
      </div>
    </div>
    <button class="go" id="analyze">Check my match</button>
    <div id="result"></div>
  </div>

  <div class="view" id="v_practice">
    <h2>Problems</h2>
    <div id="codeWrap"><h3>Coding challenges</h3><div id="codeList"></div><div id="codeArea"></div></div>
    <h3>Skill quizzes</h3>
    <div class="muted">Click a skill to take its quiz. Click &#9734; to bookmark it.</div>
    <div id="skillList"></div>
    <div class="step"><b>Skills contest</b><br><span id="cinfo"></span><br><button class="go" id="startContest">Start contest</button></div>
    <div id="testArea"></div>
  </div>

  <div class="view" id="v_page"><div id="pg"></div></div>
</div>

<div id="ov"><div id="mbox"></div></div>

  var h="<h2>Skills</h2><div class='muted'>Click a skill to open its learning page.</div><div class='dgrid'>";
  skl().forEach(function(s){h+="<div class='dcard' onclick=\"openSkill('"+esc(s)+"')\"><b>"+esc(s)+"</b><span class='muted'>about "+S[s][0]+" days</span></div>";});
  setPage(h+"</div>");
}
function skillPage(s){
  store(key("lastskill"),s);
  var d=S[s][0],st=S[s][2],per=Math.ceil(d/st.length),marked=jget(key("marks"),[]).indexOf(s)>-1;
  var h="<h2>"+esc(s)+"</h2><div class='muted'>About "+d+" days at 2 hours a day</div>";
  h+="<h3>1. Basics: what to learn</h3><div class='step'>"+esc(S[s][1])+"</div>";
  h+="<h3>2. Where to learn (free)</h3><div class='muted'>Pick the language you understand best:</div>";
  LANGS.forEach(function(l){h+="<button class='chip"+(l===lang?" active":"")+"' onclick=\"setLang('"+l+"','"+esc(s)+"')\">"+l+"</button>";});
  var yt="https://www.youtube.com/results?search_query="+encodeURIComponent(s+" tutorial for beginners"+(lang==="English"?"":" in "+lang));
  h+="<div class='step'>"+link("YouTube: "+s+" in "+lang,yt,true);
  SITES[FD[cur].t].forEach(function(x){h+=link(x[0],x[1]);});
  h+=link("Search free courses","https://www.google.com/search?q="+encodeURIComponent("learn "+s+" free course for beginners"));
  h+="<p class='muted'>Tip: choose a video with good reviews and a recent upload date. Watch 30 minutes, then try it yourself.</p></div>";
  h+="<h3>3. Day-by-day plan</h3><div class='step'>";
  st.forEach(function(t,i){var a=Math.min(i*per+1,d),b=Math.min(d,(i+1)*per);h+="<p><b>"+(a===b?"Day "+a:"Days "+a+"-"+b)+":</b> "+esc(t)+"</p>";});
  h+="</div><h3>4. Practice problems</h3><div class='step'><button class='go' style='margin:0' onclick=\"practiceSkill('"+esc(s)+"')\">Take the "+esc(s)+" quiz</button> "+link("Find more practice problems","https://www.google.com/search?q="+encodeURIComponent(s+" practice problems for beginners"))+"</div>";
  h+="<h3>5. Project</h3><div class='step'>"+esc(S[s][6])+"<br><span class='muted'>Add it to your resume with one line about the result.</span></div>";
  h+="<h3>6. 30-day plan</h3><div class='step'><p><b>Week 1 (days 1-7):</b> Learn the basics from a video in your language.</p><p><b>Week 2 (days 8-14):</b> Follow the day-by-day plan and take the quiz.</p><p><b>Week 3 (days 15-21):</b> Build the project.</p><p><b>Week 4 (days 22-30):</b> Revise, solve practice problems, do a mock interview, and update your resume.</p></div>";
  h+="<button class='chip' onclick=\"toggleMark('"+esc(s)+"')\">"+(marked?"&#9733; Bookmarked":"&#9734; Bookmark")+"</button>";
  setPage(h);
}

/* ===== kit pages ===== */
function kitsPage(){
  var h="<h2>Job preparation kits</h2><div class='dgrid'>";
  kits().forEach(function(k,i){h+="<div class='dcard' onclick='go(function(){kitPage("+i+")})'><b>"+esc(k[0])+"</b><span class='muted'>"+k[1].length+" steps</span></div>";});
  setPage(h+"</div>");
}
function kitPage(i){
  var k=kits()[i],h="<h2>"+esc(k[0])+"</h2>";
  if(k[2]){k[2].forEach(function(l){h+=link(l[0],l[1],true);});}
  h+="<div class='muted'>Follow the steps in order. Click a step to read how to do it.</div>";
  k[1].forEach(function(it,n){h+="<details"+(n===0?" open":"")+"><summary>"+esc(it[0])+"</summary><p>"+esc(it[1])+"</p></details>";});
  setPage(h);
}

/* ===== problems: coding and quizzes ===== */
function renderPractice(){
  var it=(cur==="IT / Software");
  $("codeWrap").style.display=it?"block":"none";
  $("cinfo").textContent="All "+skl().length+" skills, 5 minutes, timer on.";
  var marks=jget(key("marks"),[]),box=$("skillList");box.textContent="";
  skl().forEach(function(s){
    var w=document.createElement("span");
    var c=document.createElement("button");c.className="chip";c.textContent=s;c.onclick=function(){practiceSkill(s);};
    var st=document.createElement("button");st.className="chip";st.innerHTML=(marks.indexOf(s)>-1)?"&#9733;":"&#9734;";
    st.onclick=function(){var m=jget(key("marks"),[]),i=m.indexOf(s);if(i>-1){m.splice(i,1);}else{m.push(s);}store(key("marks"),JSON.stringify(m));renderPractice();};
    w.appendChild(c);w.appendChild(st);box.appendChild(w);
  });
  var cl=$("codeList");cl.textContent="";
  CH.forEach(function(c,i){var b=document.createElement("button");b.className="chip";b.textContent=(i+1)+". "+c.t;b.onclick=function(){openChallenge(i);};cl.appendChild(b);});
}
function openChallenge(i){
  var c=CH[i];
  $("codeArea").innerHTML="<div class='step'><b>"+esc(c.t)+"</b><br>"+esc(c.d)+"</div><textarea id='code' class='code' spellcheck='false'>"+esc(c.st)+"</textarea><div><button class='go' id='runB'>Run tests</button> <button class='chip' id='hintB'>Hint</button> <button class='chip' id='solB'>Show solution</button></div><div id='cres'></div><div id='chelp'></div>";
  $("runB").onclick=function(){runCode(i);};
  $("hintB").onclick=function(){$("chelp").innerHTML="<div class='step tip'>"+esc(c.h)+"</div>";};
  $("solB").onclick=function(){$("chelp").innerHTML="<div class='step tip'>Try it yourself first. One solution:<pre>"+esc(c.sol)+"</pre></div>";};
}
function runCode(i){
  var c=CH[i],out="",pass=0;
  try{
    var fn=new Function($("code").value+"\nreturn "+c.n+";")();
    c.tests.forEach(function(t){
      var r;try{r=fn.apply(null,t.a);}catch(e){r="Error: "+e.message;}
      var ok=JSON.stringify(r)===JSON.stringify(t.e);if(ok){pass++;}
      out+="<div class='row'><span>"+esc(c.n+"("+t.a.map(function(x){return JSON.stringify(x);}).join(", ")+")")+"</span><span class='"+(ok?"ok":"err")+"'>"+(ok?"Passed":"Expected "+esc(JSON.stringify(t.e))+", got "+esc(String(JSON.stringify(r))))+"</span></div>";
    });
  }catch(e){out="<div class='err'>There is a problem in your code: "+esc(e.message)+"</div>";}
  out="<h3>"+pass+" / "+c.tests.length+" tests passed</h3>"+out;
  if(pass===c.tests.length){out+="<p class='ok'><b>All tests passed. Great job!</b></p>";if(!solved[c.n]){solved[c.n]=1;saveSub("Coding: "+c.t,pass,c.tests.length,[]);}}
  $("cres").innerHTML=out;
}
function practiceSkill(s){showView("practice");startTest([s],s+" practice",0);}
$("startContest").onclick=function(){startTest(skl().slice(),"Skills contest",300);};
function startTest(list,title,secs){
  clearInterval(timer);test={list:list,title:title,done:false};
  var h="<h3>"+esc(title)+"</h3>"+(secs?"<div id='clock' class='clock'></div>":"");
  list.forEach(function(s,i){
    var q=qz(s);h+="<div class='step'><b>"+(i+1)+". "+esc(s)+":</b> "+q.q;
    q.o.forEach(function(o,j){h+="<label><input type='radio' name='t"+i+"' value='"+j+"'> "+o+"</label>";});
    h+="<span id='tf"+i+"'></span></div>";
  });
  h+="<button class='go' id='subT' onclick='gradeTest()'>Submit</button><div id='tres'></div>";
  $("testArea").innerHTML=h;$("testArea").scrollIntoView({behavior:"smooth"});
  if(secs){var left=secs;var tick=function(){$("clock").textContent="Time left: "+Math.floor(left/60)+":"+(left%60<10?"0":"")+(left%60);if(left<=0){gradeTest();return;}left--;};tick();timer=setInterval(tick,1000);}
}
function gradeTest(){
  if(!test||test.done){return;}
  test.done=true;clearInterval(timer);
  var score=0,wrong=[];
  test.list.forEach(function(s,i){
    var q=qz(s),c=document.querySelector("input[name='t"+i+"']:checked"),f=$("tf"+i);
    if(c&&Number(c.value)===q.a){score++;f.innerHTML=" <b>Correct!</b>";}else{wrong.push(s);f.innerHTML=" <b>Not quite.</b> Answer: "+q.o[q.a];}
  });
  var total=test.list.length;saveSub(test.title,score,total,wrong);
  $("tres").innerHTML="<h2>Score: "+score+" / "+total+" ("+Math.round(score/total*100)+"%)</h2>"+(prof()?"":"<p class='muted'>Login to appear on the leaderboard.</p>");
  $("subT").disabled=true;
}

/* ===== mock interview pages ===== */
function mockPage(){
  var h="<h2>Mock interviews</h2><div class='muted'>Pick a round, type your answers, then get feedback.</div><div class='dgrid'>";
  Object.keys(rounds()).forEach(function(t){h+="<div class='dcard' onclick=\"go(function(){roundPage('"+t+"')})\"><b>"+esc(t)+"</b><span class='muted'>"+rounds()[t].length+" questions</span></div>";});
  setPage(h+"</div>");
}
function roundPage(track){
  curMock=track;
  var h="<h2>"+esc(track)+"</h2><div class='muted'>Answer in 3 or 4 sentences, as if speaking to the interviewer.</div>";
  rounds()[track].forEach(function(q,i){h+="<div class='step'><b>Question "+(i+1)+":</b> "+esc(q[0])+"<br><textarea id='ma"+i+"' style='height:80px;margin-top:6px' placeholder='Type your answer...'></textarea><div id='mf"+i+"'></div></div>";});
  setPage(h+"<button class='go' id='mockS'>Get feedback</button><div id='mres'></div>");
  $("mockS").onclick=gradeMock;
}
function gradeMock(){
  var qs=rounds()[curMock],good=0;
  qs.forEach(function(q,i){
    var ans=$("ma"+i).value,low=ans.toLowerCase(),w=words(ans);
    var hit=q[1].filter(function(k){return low.includes(k);}),miss=q[1].filter(function(k){return !low.includes(k);});
    var ok=hit.length>=Math.ceil(q[1].length/2)&&w>=20;if(ok){good++;}
    var f="<p><b class='"+(ok?"ok":"err")+"'>"+(ok?"Good answer":"Needs work")+"</b> ("+w+" words)</p><p>Ideas you covered: "+(hit.length?esc(hit.join(", ")):"none")+"<br>Ideas to add: "+(miss.length?esc(miss.join(", ")):"none")+"</p>";
    if(w<20){f+="<p>Your answer is short. Aim for at least 30 words.</p>";}
    $("mf"+i).innerHTML=f+"<p class='muted'>Sample answer: "+esc(q[2])+"</p>";
  });
  saveSub("Mock: "+curMock,good,qs.length,[]);
  $("mres").innerHTML="<h2>"+good+" of "+qs.length+" answers were strong</h2><p class='muted'>This feedback checks key ideas and length. It is not a real AI review yet.</p>";
  $("mockS").disabled=true;
}

/* ===== job match ===== */
$("hoursSel").onchange=function(){$("customHours").style.display=(this.value==="custom")?"inline-block":"none";};
function hrs(){var v=$("hoursSel").value,h=(v==="custom")?Number($("customHours").value):Number(v);return(h&&h>0)?h:2;}
function counts(){$("rc").textContent=words($("resume").value)+" words";$("jc").textContent=words($("job").value)+" words";}
$("resume").oninput=counts;$("job").oninput=counts;
$("rclear").onclick=function(){$("resume").value="";counts();};
$("jclear").onclick=function(){$("job").value="";$("roleSel").selectedIndex=0;counts();};
$("rsample").onclick=function(){$("resume").value=FD[cur].resume;counts();};
$("roleSel").onchange=function(){if(this.value){$("job").value=FD[cur].roles[this.value];counts();}};
function readF(i,b){$(i).onchange=function(){var f=this.files[0];if(!f){return;}var r=new FileReader();r.onload=function(){$(b).value=r.result;counts();};r.readAsText(f);};}
readF("rfile","resume");readF("jfile","job");
$("newBtn").onclick=function(){showView("match");$("resume").value="";$("job").value="";$("result").innerHTML="";counts();};
function practiceMissing(){showView("practice");startTest(currentMissing.slice(),"Missing skills test",0);}

function runAnalysis(save){
  var rR=$("resume").value,jR=$("job").value,hours=hrs();
  var start=new Date();start.setHours(0,0,0,0);
  var need=[],miss=[];
  skl().forEach(function(s){if(has(jR,s)){need.push(s);if(!has(rR,s)){miss.push(s);}}});
  if(!need.length){$("result").innerHTML="<p>No known skills for <b>"+esc(cur)+"</b> found in the job description. Check the Field at the top.</p>";return;}
  if(save){addHistory(need.slice(0,3).join(", ")+" job",rR,jR);}
  var pc=Math.round((need.length-miss.length)/need.length*100);
  var h="<h2>"+pc+"% match</h2><div class='bar'><div class='fill' style='width:"+pc+"%'></div></div><p><b>Missing skills:</b> "+(miss.length?miss.join(", "):"none, great job!")+"</p>";
  if(miss.length){
    miss.sort(function(a,b){return S[a][0]-S[b][0];});currentMissing=miss;
    if(save){store(key("plan"),JSON.stringify({miss:miss,hours:hours,start:start.getTime(),field:cur}));}
    h+="<h2>Your learning roadmap</h2>";
    var dl=[];
    miss.forEach(function(s,j){
      var dn=Math.ceil(S[s][0]*2/hours),first=dl.length;
      for(var d=0;d<dn;d++){dl.push(j);}
      var f=new Date(start);f.setDate(f.getDate()+first);var t=new Date(start);t.setDate(t.getDate()+dl.length-1);
      h+="<div class='step'><b>Step "+(j+1)+": "+esc(s)+"</b> ("+dn+" days, "+sdate(f)+" to "+sdate(t)+")<br>"+esc(S[s][1])+"<br><button class='chip active' onclick=\"openSkill('"+esc(s)+"')\">Learn this skill</button></div>";
    });
    h+="<p><b>Total time: about "+dl.length+" days</b> (studying "+hours+" hour(s) a day)</p><h2>Your study calendar</h2>"+calHTML(miss,dl,start,0)+"<p class='muted'>Your plan is saved. Open the Dashboard any day to continue learning.</p><button class='go' onclick='practiceMissing()'>Test my missing skills</button>";
  }
  h+="<h2>Tips for you</h2><div class='step tip'>"+JT[$("jobType").value]+"</div><div class='step tip'>"+ET[$("exp").value]+"</div>";
  $("result").innerHTML=h;
}
$("analyze").onclick=function(){runAnalysis(true);};

/* ===== search ===== */
$("q").oninput=function(){
  var v=this.value.trim().toLowerCase(),box=$("qres");box.textContent="";
  if(!v){box.style.display="none";return;}
  var r=[];
  skl().forEach(function(s){r.push(["Skill: "+s,function(){openSkill(s);}]);});
  kits().forEach(function(k,i){r.push(["Guide: "+k[0],function(){go(function(){kitPage(i);});}]);});
  Object.keys(rounds()).forEach(function(t){r.push(["Mock interview: "+t,function(){go(function(){roundPage(t);});}]);});
  if(cur==="IT / Software"){CH.forEach(function(c,i){r.push(["Problem: "+c.t,function(){showView("practice");openChallenge(i);}]);});}
  var hits=r.filter(function(x){return x[0].toLowerCase().indexOf(v)>-1;}).slice(0,8);
  box.style.display="block";
  if(!hits.length){var n=document.createElement("div");n.textContent="Nothing found";box.appendChild(n);return;}
  hits.forEach(function(x){var d=document.createElement("div");d.textContent=x[0];d.onclick=function(){box.style.display="none";$("q").value="";x[1]();};box.appendChild(d);});
};

/* ===== field dropdown ===== */
function applyField(name){
  cur=name;store("jrh_field",name);
  var rs=$("roleSel");rs.textContent="";
  var o0=document.createElement("option");o0.value="";o0.textContent="Sample role...";rs.appendChild(o0);
  Object.keys(FD[cur].roles).forEach(function(k){var o=document.createElement("option");o.textContent=k;rs.appendChild(o);});
  $("result").innerHTML="";$("testArea").innerHTML="";$("codeArea").innerHTML="";currentMissing=[];
  showView("dash");
}
Object.keys(FD).forEach(function(k){var o=document.createElement("option");o.textContent=k;$("fieldSel").appendChild(o);});
$("fieldSel").value=cur;
$("fieldSel").onchange=function(){applyField(this.value);};

/* ===== start ===== */
setTheme(read("jrh_theme")==="dark"?"dark":"light");
showProfile();applyField(cur);counts();
</script>
